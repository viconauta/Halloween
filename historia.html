<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="page">
    <header>
        <button class="hamburger" type="button" aria-label="Abrir menú">
            <span class="barMenu"></span>
            <span class="barMenu"></span>
            <span class="barMenu"></span>
        </button>
        <nav id="menu-desplegable" class="oculto">
            <ul>
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./recetas.html">Recetas</a></li>
                <li><a href="./historia.html">Historias de miedo</a></li>
                <li><a href="./sonidos.html">Música y tonos</a></li>
                <li><a href="./enGranada.html">Granada</a></li>
                <li><a href="./juego.html">Juego</a></li>
                <li><a class="enlace-cuenta oculto" href="./miCuenta.html">Mi cuenta</a></li>
            </ul>
        </nav>
        <a class="logo" href="./index.html">GranaWeen</a>
        <button class="login btn" type="button">Iniciar sesión</button>
    </header>

    <main>
        <section>
            <div class="titulo">
                <h1>Una Historia de Miedo</h1>
            </div>
            <div class="video">
                <div class="teatro-historia" id="teatro-historia" aria-label="Telón de la historia">
                    <div class="telon telon-izquierdo" aria-hidden="true"></div>
                    <div class="telon telon-derecho" aria-hidden="true"></div>
                    <button class="btn boton-telon" id="abrir-historia" type="button">Abrir el telón</button>
                </div>
            </div>
            <div class="descripcion"></div>
        </section>
    </main>

    <footer>
        <div>
            <a href="./index.html" class="logo">GranaWeen</a>
        </div>
        <div class="us">
            <a href="./sobreNosotros.html">Sobre nosotros</a>
        </div>
        <div class="contacto">
            <h2>Contacto</h2>
            <p>Tel: 691264860</p>
            <p>Email: granaween@gmail.es</p>
            <p>Dirección: Avda. Halloween, Granada</p>
        </div>
    </footer>

    <!-- Ventanas modales -->
    <div id="ventana-login" class="oculto">
        <button class="cerrar-ventana" type="button" aria-label="Cerrar">×</button>
        <h2>Iniciar sesión</h2>
        <form action="./php/login.php" method="post">
            <label for="nombre">Nombre de usuario:</label>
            <input type="text" name="nombre" id="nombre" placeholder="Escribe tu usuario" required>
            <label for="password">Contraseña:</label>
            <input type="password" name="password" id="password" placeholder="Escribe tu contraseña" required>
            <button type="submit" class="btn">Iniciar sesión</button>
            <button type="button" class="registro">¿No tienes cuenta? | Regístrate</button>
            <button type="button" class="recuperar-contraseña">He olvidado mi contraseña</button>
        </form>
    </div>

    <div id="ventana-registro" class="oculto">
        <button class="cerrar-ventana" type="button" aria-label="Cerrar">×</button>
        <h2>Crear cuenta</h2>
        <form action="./php/altaUsuario.php" method="post">
            <label for="reg-nombre">Nombre de usuario:</label>
            <input type="text" name="nombre" id="reg-nombre" placeholder="Escribe tu usuario" required>
            <label for="reg-password">Contraseña:</label>
            <input type="password" name="password" id="reg-password" placeholder="Tu contraseña" required>
            <label for="reg-email">Email:</label>
            <input type="email" name="email" id="reg-email" placeholder="tuEmail@ejemplo.com" required>
            <label for="reg-pregunta">Pregunta de seguridad:</label>
            <input type="text" name="pregunta" id="reg-pregunta" placeholder="Ej: ¿Nombre de mi primera mascota?">
            <label for="reg-respuesta">Respuesta:</label>
            <input type="text" name="respuesta" id="reg-respuesta" placeholder="Tu respuesta secreta">
            <button type="submit" class="btn">Registrarse</button>
        </form>
    </div>

    <div id="ventana-recuperacion" class="oculto">
        <button class="cerrar-ventana" type="button" aria-label="Cerrar">×</button>
        <h2>Recuperar contraseña</h2>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
